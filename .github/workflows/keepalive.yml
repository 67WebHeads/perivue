name: Supabase Keepalive

on:
  schedule:
    # 03:00 UTC every 3rd day — well inside the ~7 day free-tier pause window
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install psycopg2-binary==2.9.11 python-dotenv==1.2.2

      - name: Ping Supabase
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: python backend/scripts/keepalive.py
