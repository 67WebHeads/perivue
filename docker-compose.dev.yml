  # Django backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # entrypoint: sh /app/entrypoint.sh
    ports:
      - "8000:8000"
    # depends_on:
    #   - db
    container_name: perviue-backend
    # env_file:
